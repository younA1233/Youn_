name: Check CROUS Multi-villes

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la surveillance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITIES_JSON: ${{ secrets.CITIES_JSON }}
        run: python check_crous.py

      - name: Sauvegarder l'état (seen.json)
        run: |
          git config user.name "crous-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen.json [skip ci]"
          git push
